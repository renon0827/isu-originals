# ローカル用の nginx 設定
# ブラウザからは https://isufactory.isucon.test/（/etc/hosts で app1 に向ける）、
# ベンチマーカーからは http://<app1 の IP>/ でアクセスされる。
upstream app {
    server app:8080;
}

server {
    listen 80 default_server;
    server_name _;


    client_max_body_size 10m;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://app;
    }
}
