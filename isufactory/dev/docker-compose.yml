# ローカル開発・検証用の環境。
# app1 相当（mysql + app + nginx）を CPU 制限つきで再現し、bench から負荷をかける。
#
#   docker compose up -d mysql
#   docker compose --profile setup run --rm setup   # 初回のみ: 初期データ投入
#   docker compose up -d app nginx
#   docker compose --profile bench run --rm bench
name: isufactory

x-go: &go
  build: { context: ., dockerfile: Dockerfile.app }
  image: isufactory-dev-go
  volumes:
    - ..:/isufactory
    - gocache:/root/.cache
    - gomod:/go/pkg/mod

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: isucon
      MYSQL_PASSWORD: isucon
    volumes:
      - ../provisioning/mysql/isufactory.cnf:/etc/mysql/conf.d/isufactory.cnf:ro
      - mysql:/var/lib/mysql
    cpus: 1.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 3s
      retries: 40

  setup:
    <<: *go
    profiles: ["setup"]
    depends_on: { mysql: { condition: service_healthy } }
    working_dir: /isufactory
    command:
      - bash
      - -c
      - |
        set -e
        until mysql -hmysql -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done
        mysql -hmysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS isufactory; CREATE DATABASE IF NOT EXISTS isufactory_init; GRANT ALL ON isufactory.* TO 'isucon'@'%'; GRANT ALL ON isufactory_init.* TO 'isucon'@'%';"
        provisioning/load-data.sh /isufactory -hmysql -uroot -proot
        echo setup done

  app:
    <<: *go
    depends_on: { mysql: { condition: service_healthy } }
    working_dir: /isufactory/webapp/go
    environment:
      ISUFACTORY_DB_HOST: mysql
      ISUFACTORY_PUBLIC_DIR: /isufactory/webapp/public
    command: bash -c "go build -o /tmp/isufactory . && exec /tmp/isufactory"
    cpus: 1.0
    mem_limit: 1g

  nginx:
    image: nginx:1.27
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["38080:80"]
    cpus: 0.5

  bench:
    <<: *go
    profiles: ["bench"]
    working_dir: /isufactory/bench
    entrypoint: ["bash", "-c", "go build -o /tmp/bench . && exec /tmp/bench -target http://nginx \"$$@\"", "--"]
    cpus: 4.0

volumes:
  mysql:
  gocache:
  gomod:
