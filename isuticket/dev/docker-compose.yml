# ローカル開発・検証用の環境。
# app1 相当（mysql + app + nginx）を CPU 制限つきで再現し、bench から負荷をかける。
#
#   docker compose up -d mysql
#   docker compose run --rm setup      # 初回のみ: 鍵生成・初期データ投入
#   docker compose up -d app nginx
#   docker compose run --rm bench
name: isuticket

x-go: &go
  build: { context: ., dockerfile: Dockerfile.app }
  image: isuticket-dev-go
  volumes:
    - ..:/isuticket
    - keys:/home/isucon/keys
    - gocache:/root/.cache
    - gomod:/go/pkg/mod

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: isucon
      MYSQL_PASSWORD: isucon
    volumes:
      - ../provisioning/mysql/isuticket.cnf:/etc/mysql/conf.d/isuticket.cnf:ro
      - mysql:/var/lib/mysql
    cpus: 1.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 3s
      retries: 40

  setup:
    <<: *go
    profiles: ["setup"]
    depends_on: { mysql: { condition: service_healthy } }
    working_dir: /isuticket
    command:
      - bash
      - -c
      - |
        set -e
        until mysql -hmysql -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done
        provisioning/gen-keys.sh /home/isucon/keys
        mysql -hmysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS isuticket; CREATE DATABASE IF NOT EXISTS isuticket_init; GRANT ALL ON isuticket.* TO 'isucon'@'%'; GRANT ALL ON isuticket_init.* TO 'isucon'@'%';"
        provisioning/load-data.sh /isuticket -hmysql -uroot -proot
        echo setup done

  app:
    <<: *go
    depends_on: { mysql: { condition: service_healthy } }
    working_dir: /isuticket/webapp/go
    environment:
      ISUTICKET_DB_HOST: mysql
      ISUTICKET_KEY_DIR: /home/isucon/keys
      ISUTICKET_PUBLIC_DIR: /isuticket/webapp/public
    command: bash -c "go build -o /tmp/isuticket . && exec /tmp/isuticket"
    cpus: 1.0
    mem_limit: 1g

  nginx:
    image: nginx:1.27
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18080:80"]
    cpus: 0.5

  bench:
    <<: *go
    profiles: ["bench"]
    working_dir: /isuticket/bench
    entrypoint: ["bash", "-c", "go build -o /tmp/bench . && exec /tmp/bench -target http://nginx -payment-url http://$$(hostname -i | cut -d\" \" -f1):12346 \"$$@\"", "--"]
    cpus: 4.0

volumes:
  mysql:
  keys:
  gocache:
  gomod:
