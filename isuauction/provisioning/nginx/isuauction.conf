# nginx の設定
# ブラウザからは https://isuauction.isucon.test/（/etc/hosts で app1 に向ける）、
# ベンチマーカーからは http://<app1 の IP>/ でアクセスされる。
upstream app {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # 自己署名証明書（プロビジョニング時に生成）
    ssl_certificate     /etc/nginx/tls/isuauction.crt;
    ssl_certificate_key /etc/nginx/tls/isuauction.key;

    client_max_body_size 10m;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://app;
    }
}
